name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    # Some tests still use Windows-only paths; drop this once T2 lands.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: |
          # Actions sets 'stop'; on 5.1 that turns child stderr captured by 2>&1 into a terminating error.
          $ErrorActionPreference = 'Continue'
          $PSVersionTable.PSVersion.ToString()
          $exe = (Get-Process -Id $PID).Path
          $failed = @()
          foreach ($t in Get-ChildItem -Path tests -Filter '*.Tests.ps1' | Sort-Object Name) {
              Write-Host "::group::$($t.Name)"
              $out = @(& $exe -NoProfile -ExecutionPolicy Bypass -File $t.FullName 2>&1 | ForEach-Object { [string]$_ })
              $code = $LASTEXITCODE
              $out | ForEach-Object { Write-Host $_ }
              Write-Host "::endgroup::"
              if ($code -ne 0) {
                  # Put the tail of the output into the annotation so the reason shows on the PR.
                  $tail = ($out | Select-Object -Last 25) -join "`n"
                  $tail = $tail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
                  Write-Host "::error file=tests/$($t.Name)::$($t.Name) exited with code $code%0A$tail"
                  $failed += $t.Name
              }
          }
          if ($failed.Count -gt 0) {
              Write-Host ("Failed: " + ($failed -join ', '))
              exit 1
          }
          Write-Host 'All test scripts passed.'
