name: diag
on: push
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $f = Join-Path $env:RUNNER_TEMP 'fx'
          New-Item -ItemType Directory -Force "$f\hooks","$f\requests" | Out-Null
          $h = Get-Content hooks\ClaudeHook.ps1 -Raw -Encoding UTF8
          $h = $h.Replace("Write-HookLog ('error at {0}: {1}' -f `$stage, `$_.Exception.GetType().Name)", "Write-HookLog ('error at {0}: {1} | {2}' -f `$stage, `$_, `$_.InvocationInfo.PositionMessage)")
          [IO.File]::WriteAllText("$f\hooks\ClaudeHook.ps1", $h, (New-Object Text.UTF8Encoding($true)))
          [IO.File]::WriteAllText("$f\unified-overlay.pid", [string]$PID)
          [IO.File]::WriteAllText("$f\requests\overlay.alive", 'x')
          $info = New-Object System.Diagnostics.ProcessStartInfo
          $info.FileName = (Get-Process -Id $PID).Path
          $info.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + "$f\hooks\ClaudeHook.ps1" + '" -Agent claude'
          $info.UseShellExecute = $false; $info.CreateNoWindow = $true
          $info.RedirectStandardInput = $true; $info.RedirectStandardOutput = $true; $info.RedirectStandardError = $true
          $p = New-Object System.Diagnostics.Process; $p.StartInfo = $info
          [void]$p.Start()
          $p.StandardInput.WriteLine('{"hook_event_name":"Stop","session_id":"s1","cwd":"C:/p/demo","last_assistant_message":"All tests pass.\n\nThe build is green."}'); $p.StandardInput.Close()
          $done = $p.WaitForExit(8000)
          $err = $p.StandardError.ReadToEnd(); $out = $p.StandardOutput.ReadToEnd()
          $files = (Get-ChildItem "$f\requests" | ForEach-Object { $_.Name + '=' + (Get-Content $_.FullName -Raw) }) -join ' || '
          $log = "done=$done exit=$($p.ExitCode)`nerr=$err`nout=$out`nfiles=$files"
          $log = $log -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
          Write-Host "::error::diag%0A$log"
